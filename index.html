<title>BossBabu | Tiny Boss. Big Entrance.</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e91d25'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' font-family='Arial' font-weight='bold' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--red:#e91d25}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--red)}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden}
main{position:relative;isolation:isolate;min-height:100svh;display:grid;place-items:center;padding:48px 24px 64px;overflow:hidden}
.scene{position:relative;z-index:2;width:min(700px,100%);text-align:center;display:flex;flex-direction:column;align-items:center}
.head-window{height:clamp(170px,26vw,220px);width:260px;max-width:100%;overflow:hidden;position:relative}
.baby-button{display:block;width:clamp(160px,25vw,205px);padding:0;margin:8px auto 0;border:0;background:transparent;cursor:pointer;transform-origin:50% 80%;animation:peek 1.25s cubic-bezier(.2,.8,.25,1.15) both;-webkit-tap-highlight-color:transparent}
.baby-button:focus-visible{outline:2px dashed #fff;outline-offset:-5px;border-radius:50%}
.face{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 80%;animation:hello 4.6s ease-in-out infinite 1.3s}
.baby-button.excited .face{animation:party .9s ease-in-out}
.wordmark{display:block;width:100%;max-width:480px;height:auto;margin-top:12px;position:relative;z-index:3;animation:arrive .75s ease both .35s}
.slogan{font-size:clamp(13px,2.6vw,17px);line-height:1.6;margin:16px 0 0;animation:arrive .75s ease both .65s}
.status{font-size:clamp(34px,6.2vw,58px);font-weight:800;line-height:1.06;letter-spacing:-.045em;margin:40px 0 0}
.status span{display:block;animation:title-pop .85s cubic-bezier(.2,.9,.25,1.2) both .9s}.status span+span{animation-delay:1.08s}
.subcopy{font-size:clamp(14px,2.7vw,17px);line-height:1.6;margin:18px 0 0;animation:arrive .8s ease both 1.2s;color:#fff}
.dots{display:flex;justify-content:center;gap:8px;margin-top:25px;height:8px}.dots span{height:6px;width:6px;border-radius:50%;background:#fff;animation:dot 1.65s ease-in-out infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}.float{position:absolute;color:rgba(255,255,255,.22);animation:drift var(--duration,8s) ease-in-out infinite;animation-delay:var(--delay,0s)}.float svg{width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.5}
.f1{left:10%;top:15%;width:38px;height:38px;--duration:7s}.f2{right:12%;top:21%;width:55px;height:55px;--duration:9s;--delay:-3s}.f3{left:17%;top:68%;width:65px;height:65px;--duration:11s;--delay:-4s}.f4{right:8%;top:72%;width:32px;height:32px;--duration:8s;--delay:-1s}.f5{left:6%;top:43%;width:32px;height:32px;--duration:10s;--delay:-5s}.f6{right:20%;top:49%;width:38px;height:38px;--duration:7.5s;--delay:-2s}.f7{right:31%;top:8%;width:15px;height:15px;--duration:6s;--delay:-1s}.f8{left:35%;bottom:7%;width:18px;height:18px;--duration:9s;--delay:-6s}
.burst-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}.spark{position:absolute;color:#fff;font-size:23px;animation:spark .85s ease-out forwards;will-change:transform,opacity}

@keyframes peek{0%{transform:translateY(115%) rotate(-15deg)}65%{transform:translateY(-10px) rotate(6deg)}85%{transform:translateY(5px) rotate(-3deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes hello{0%,100%{transform:translateY(0) rotate(-3deg)}24%{transform:translateY(-9px) rotate(5deg)}45%{transform:translateY(1px) rotate(-4deg)}63%{transform:translateY(-7px) rotate(3deg)}82%{transform:translateY(0) rotate(-1deg)}}
@keyframes party{0%,100%{transform:scale(1) rotate(0)}20%{transform:translateY(-12px) scale(1.08) rotate(-9deg)}45%{transform:translateY(-2px) scale(1.04) rotate(9deg)}70%{transform:translateY(-10px) scale(1.08) rotate(-5deg)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-22px) rotate(12deg)}}
@keyframes title-pop{from{opacity:0;transform:translateY(20px) scale(.92)}65%{opacity:1;transform:translateY(-3px) scale(1.015)}to{opacity:1;transform:none}}
@keyframes dot{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-5px)}}
@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--spin)) scale(.65)}}
.motion-paused *{animation-play-state:paused!important}.motion-paused .feature-motion{display:none}.motion-paused .spark{display:none}
@media(max-width:480px){main{padding:38px 22px 60px}.status{margin-top:32px}.slogan{max-width:290px}.f1{left:5%;top:13%;width:25px;height:25px}.f2{right:5%;top:20%;width:32px;height:32px}.f3{left:5%;top:75%;width:35px;height:35px}.f6{right:5%;top:56%;width:24px;height:24px}.wordmark{margin-top:8px}}
@media(max-height:620px) and (min-width:600px){main{padding:28px 24px 52px}.head-window{height:140px}.baby-button{width:130px}.wordmark{max-width:320px;margin-top:8px}.slogan{margin-top:9px;font-size:13px}.status{margin-top:24px;font-size:40px}.subcopy{margin-top:12px;font-size:14px}.dots{margin-top:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.feature-motion{display:none}.spark{display:none}}
</style>
</head>

<script>
(() => {
 const baby = document.querySelector('.baby-button');
 const layer = document.querySelector('.burst-layer');
 const main = document.querySelector('main');
 const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
 let timer;
 function setPaused(paused) {
   document.body.classList.toggle('motion-paused', paused);
   document.querySelectorAll('svg.face').forEach(svg => {
     if (paused && svg.pauseAnimations) svg.pauseAnimations();
     if (!paused && svg.unpauseAnimations) svg.unpauseAnimations();
   });
 }
 setPaused(reduce.matches);
 reduce.addEventListener('change', e => setPaused(e.matches));
 baby.addEventListener('click', () => {
   if (reduce.matches || document.body.classList.contains('motion-paused')) return;
   clearTimeout(timer);
   baby.classList.remove('excited');
   void baby.offsetWidth;
   baby.classList.add('excited');

   for (let i = 0; i < 9; i++) {
     const spark = document.createElement('span');
     spark.className = 'spark'; spark.textContent = i % 3 ? '✦' : '☆';
     const angle = (i / 9) * Math.PI * 2;
     spark.style.left = (b.left - m.left + b.width / 2) + 'px';
     spark.style.top = (b.top - m.top + b.height / 2) + 'px';
     spark.style.setProperty('--x', Math.cos(angle) * (85 + i * 5) + 'px');
     spark.style.setProperty('--y', Math.sin(angle) * (80 + i * 5) + 'px');
     spark.style.setProperty('--spin', (i % 2 ? 100 : -100) + 'deg');
     layer.appendChild(spark);
     setTimeout(() => spark.remove(), 900);
   }
   timer = setTimeout(() => baby.classList.remove('excited'), 950);
 });
})();
</script>

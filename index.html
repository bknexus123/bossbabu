<style>
:root{color-scheme:dark;--red:#e91d25}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--red)}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden}
main{position:relative;isolation:isolate;min-height:100svh;display:grid;place-items:center;padding:48px 24px 64px;overflow:hidden}
.scene{position:relative;z-index:2;width:min(700px,100%);text-align:center;display:flex;flex-direction:column;align-items:center}
.head-window{height:clamp(170px,26vw,220px);width:260px;max-width:100%;overflow:hidden;position:relative}
.baby-button{display:block;width:clamp(160px,25vw,205px);padding:0;margin:8px auto 0;border:0;background:transparent;cursor:pointer;transform-origin:50% 80%;animation:peek .65s cubic-bezier(.2,.8,.25,1.15) both;-webkit-tap-highlight-color:transparent}
.baby-button:focus-visible{outline:2px dashed #fff;outline-offset:-5px;border-radius:50%}
.face{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 80%;animation:hello 1.9s ease-in-out infinite .7s}
.baby-button.excited .face{animation:party .55s ease-in-out}
.wordmark{display:block;width:100%;max-width:480px;height:auto;margin-top:12px;position:relative;z-index:3;animation:arrive .4s ease both .15s}
.slogan{font-size:clamp(13px,2.6vw,17px);line-height:1.6;margin:16px 0 0;animation:arrive .4s ease both .25s}
.status{font-size:clamp(34px,6.2vw,58px);font-weight:800;line-height:1.06;letter-spacing:-.045em;margin:40px 0 0}
.status span{display:block;animation:title-pop .45s cubic-bezier(.2,.9,.25,1.2) both .35s}.status span+span{animation-delay:.48s}
.subcopy{font-size:clamp(14px,2.7vw,17px);line-height:1.6;margin:18px 0 0;animation:arrive .45s ease both .55s;color:#fff}
.dots{display:flex;justify-content:center;gap:8px;margin-top:25px;height:8px}.dots span{height:6px;width:6px;border-radius:50%;background:#fff;animation:dot .9s ease-in-out infinite}.dots span:nth-child(2){animation-delay:.12s}.dots span:nth-child(3){animation-delay:.24s}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}.float{position:absolute;color:rgba(255,255,255,.22);animation:drift var(--duration,8s) ease-in-out infinite;animation-delay:var(--delay,0s)}.float svg{width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.5}
.f1{left:10%;top:15%;width:38px;height:38px;--duration:3.36s}.f2{right:12%;top:21%;width:55px;height:55px;--duration:4.32s;--delay:-3s}.f3{left:17%;top:68%;width:65px;height:65px;--duration:5.28s;--delay:-4s}.f4{right:8%;top:72%;width:32px;height:32px;--duration:3.84s;--delay:-1s}.f5{left:6%;top:43%;width:32px;height:32px;--duration:4.8s;--delay:-5s}.f6{right:20%;top:49%;width:38px;height:38px;--duration:3.6s;--delay:-2s}.f7{right:31%;top:8%;width:15px;height:15px;--duration:2.88s;--delay:-1s}.f8{left:35%;bottom:7%;width:18px;height:18px;--duration:4.32s;--delay:-6s}
.burst-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}.spark{position:absolute;color:#fff;font-size:23px;animation:spark .55s ease-out forwards;will-change:transform,opacity}

@keyframes peek{0%{transform:translateY(115%) rotate(-15deg)}65%{transform:translateY(-10px) rotate(6deg)}85%{transform:translateY(5px) rotate(-3deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes hello{0%,100%{transform:translateY(0) rotate(-3deg)}24%{transform:translateY(-5px) rotate(3deg)}45%{transform:translateY(1px) rotate(-2deg)}63%{transform:translateY(-4px) rotate(2deg)}82%{transform:translateY(0) rotate(-1deg)}}
@keyframes party{0%,100%{transform:scale(1) rotate(0)}20%{transform:translateY(-12px) scale(1.08) rotate(-9deg)}45%{transform:translateY(-2px) scale(1.04) rotate(9deg)}70%{transform:translateY(-10px) scale(1.08) rotate(-5deg)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes title-pop{from{opacity:0;transform:translateY(20px) scale(.92)}65%{opacity:1;transform:translateY(-3px) scale(1.015)}to{opacity:1;transform:none}}
@keyframes dot{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-5px)}}
@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--spin)) scale(.65)}}

@media(max-width:480px){main{padding:38px 22px 60px}.status{margin-top:32px}.slogan{max-width:290px}.f1{left:5%;top:13%;width:25px;height:25px}.f2{right:5%;top:20%;width:32px;height:32px}.f3{left:5%;top:75%;width:35px;height:35px}.f6{right:5%;top:56%;width:24px;height:24px}.wordmark{margin-top:8px}}
@media(max-height:620px) and (min-width:600px){main{padding:28px 24px 52px}.head-window{height:140px}.baby-button{width:130px}.wordmark{max-width:320px;margin-top:8px}.slogan{margin-top:9px;font-size:13px}.status{margin-top:24px;font-size:40px}.subcopy{margin-top:12px;font-size:14px}.dots{margin-top:16px}}
@keyframes gentle-hello{0%,100%{transform:rotate(-1deg)}50%{transform:translateY(-2px) rotate(1deg)}}
@media(prefers-reduced-motion:reduce){.face{animation:gentle-hello 2s ease-in-out infinite}.float,.baby-button,.wordmark,.slogan,.status span,.subcopy{animation:none}.baby-button.excited .face{animation:gentle-hello .55s ease-in-out}.spark{display:none}}

/* Footer only: main scene and its animations are unchanged */
.site-footer{position:relative;z-index:5;background:var(--red);color:#fff;text-align:center;padding:22px 18px 28px;font-size:12px;line-height:1.8}
.footer-social{display:flex;justify-content:center;align-items:center;gap:12px;margin:0 auto 14px}
.footer-social a{display:inline-flex;width:38px;height:38px;border:1px solid rgba(255,255,255,.6);border-radius:50%;align-items:center;justify-content:center;color:#fff;transition:background .2s,color .2s,transform .2s}
.footer-social a:hover,.footer-social a:focus-visible{background:#fff;color:var(--red);transform:translateY(-2px)}
.footer-social svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.footer-copy{margin:0;color:rgba(255,255,255,.84)}
.footer-copy a{color:#fff;font-weight:600;text-underline-offset:3px}
.footer-copy a:hover{text-decoration-thickness:2px}
@media(max-width:480px){.site-footer{padding:16px 16px 24px;font-size:11px}}

/* Screen-fit update: footer visible with the full experience on laptop / desktop. */
html{height:100%;}
body{min-height:100svh;display:flex;flex-direction:column;}
main{flex:1 1 auto;min-height:0;padding:16px 24px 12px;display:grid;place-items:center;}
.site-footer{flex:0 0 auto;padding:8px 16px 14px;line-height:1.45;}
.footer-social{gap:11px;margin-bottom:7px;}

.footer-social svg{height:17px;width:17px;}
.head-window{height:clamp(116px,22svh,198px);}
.baby-button{width:clamp(110px,21svh,185px);}
.wordmark{max-width:min(440px,56svh);margin-top:5px;}

.subcopy{margin-top:10px;font-size:clamp(12px,1.9svh,17px);}
.dots{margin-top:14px;}
@media (min-width:600px) and (min-height:480px){
 html,body{height:100%;overflow:hidden;}
}
@media (min-width:600px) and (max-height:650px){

 .head-window{height:clamp(95px,19svh,130px);}

 .wordmark{max-width:320px;margin-top:2px;}
 .slogan{margin-top:5px;font-size:12px;}

 .subcopy{margin-top:5px;font-size:12px;}
 .dots{margin-top:9px;}
 .site-footer{padding:4px 16px 8px;}
 .footer-social{margin-bottom:4px;}
}
@media (max-width:599px){
 main{padding:16px 18px 12px;min-height:0;}
 .head-window{height:clamp(115px,21svh,185px);}
 .baby-button{width:clamp(105px,20svh,168px);}
 .wordmark{max-width:min(380px,84vw);margin-top:5px;}
 .slogan{margin-top:9px;}
 .status{margin-top:clamp(15px,3svh,26px);font-size:clamp(32px,8.5vw,50px);}
 .subcopy{margin-top:9px;}
 .site-footer{padding:8px 12px 14px;font-size:11px;}
}
@media (max-height:550px) and (max-width:599px){
 body{overflow-y:auto;}
 main{min-height:420px;}
}

<script>
(() => {
 const baby = document.querySelector('.baby-button');
 const layer = document.querySelector('.burst-layer');
 const main = document.querySelector('main');
 const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
 let timer;
 const giggle = document.querySelector('#welcome-giggle');
 giggle.volume = .48;
 let soundPlayed = false;
 let playPending = false;
 function removeSoundListeners() {
   document.removeEventListener('pointerdown', playWelcomeGiggle);
   document.removeEventListener('keydown', playWelcomeGiggle);
 }
 function playWelcomeGiggle() {
   if (soundPlayed || playPending) return;
   playPending = true;
   try {
     const result = giggle.play();
     if (result && typeof result.then === 'function') {
       result.then(() => {
         soundPlayed = true;
         playPending = false;
         removeSoundListeners();
       }).catch(() => { playPending = false; });
     } else {
       soundPlayed = true;
       playPending = false;
       removeSoundListeners();
     }
   } catch (_) { playPending = false; }
 }
 document.addEventListener('pointerdown', playWelcomeGiggle, {passive:true});
 document.addEventListener('keydown', playWelcomeGiggle);
 playWelcomeGiggle();
 baby.addEventListener('click', () => {
   clearTimeout(timer);
   baby.classList.remove('excited');
   void baby.offsetWidth;
   baby.classList.add('excited');
   const b = baby.getBoundingClientRect(), m = main.getBoundingClientRect();
   for (let i = 0; i < (reduce.matches ? 0 : 9); i++) {
     const spark = document.createElement('span');
     spark.className = 'spark'; spark.textContent = i % 3 ? '✦' : '☆';
     const angle = (i / 9) * Math.PI * 2;
     spark.style.left = (b.left - m.left + b.width / 2) + 'px';
     spark.style.top = (b.top - m.top + b.height / 2) + 'px';
     spark.style.setProperty('--x', Math.cos(angle) * (85 + i * 5) + 'px');
     spark.style.setProperty('--y', Math.sin(angle) * (80 + i * 5) + 'px');
     spark.style.setProperty('--spin', (i % 2 ? 100 : -100) + 'deg');
     layer.appendChild(spark);
     setTimeout(() => spark.remove(), 600);
   }
   timer = setTimeout(() => baby.classList.remove('excited'), 600);
 });
})();
</script>
